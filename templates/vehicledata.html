<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 650px;
            margin: 50px auto;
            background: #ffffffee;
            padding: 35px 45px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 600;
            color: #34495e;
        }

        input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            margin-top: 8px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            transition: 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: #5dade2;
            outline: none;
            box-shadow: 0 0 4px rgba(93, 173, 226, 0.6);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: linear-gradient(135deg, #3498db, #2ecc71);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .train-button {
            background: linear-gradient(135deg, #e67e22, #f1c40f);
            margin-top: 15px;
        }

        .result {
            margin-top: 30px;
            background-color: #eafaf1;
            border-left: 6px solid #2ecc71;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            color: #1e8449;
            box-shadow: 0 2px 8px rgba(46, 204, 113, 0.3);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 New Vehicle Insurance Prediction Model</h1>

        <form method="post" action="/">
            <label for="Gender">Gender (1: Male, 0: Female)</label>
            <input type="number" id="Gender" name="Gender" min="0" max="1" required>

            <label for="Age">Age (e.g., 35)</label>
            <input type="number" id="Age" name="Age" required>

            <label for="Driving_License">Driving License (0: No, 1: Yes)</label>
            <input type="number" id="Driving_License" name="Driving_License" min="0" max="1" required>

            <label for="Region_Code">Region Code (e.g., 28.0)</label>
            <input type="number" step="0.01" id="Region_Code" name="Region_Code" required>

            <label for="Previously_Insured">Previously Insured (0: No, 1: Yes)</label>
            <input type="number" id="Previously_Insured" name="Previously_Insured" min="0" max="1" required>

            <label for="Annual_Premium">Annual Premium (e.g., 30000.00)</label>
            <input type="number" step="0.01" id="Annual_Premium" name="Annual_Premium" required>

            <label for="Policy_Sales_Channel">Policy Sales Channel (e.g., 152.0)</label>
            <input type="number" step="0.01" id="Policy_Sales_Channel" name="Policy_Sales_Channel" required>

            <label for="Vintage">Vintage (Number of Days)</label>
            <input type="number" id="Vintage" name="Vintage" required>

            <label for="Vehicle_Age_lt_1_Year">Vehicle Age &lt; 1 Year (0: No, 1: Yes)</label>
            <input type="number" id="Vehicle_Age_lt_1_Year" name="Vehicle_Age_lt_1_Year" min="0" max="1" required>

            <label for="Vehicle_Age_gt_2_Years">Vehicle Age &gt; 2 Years (0: No, 1: Yes)</label>
            <input type="number" id="Vehicle_Age_gt_2_Years" name="Vehicle_Age_gt_2_Years" min="0" max="1" required>

            <label for="Vehicle_Damage_Yes">Vehicle Damage (0: No, 1: Yes)</label>
            <input type="number" id="Vehicle_Damage_Yes" name="Vehicle_Damage_Yes" min="0" max="1" required>

            <button type="submit">🚀 Predict</button>
        </form>

        <form method="get" action="/train">
            <button type="submit" class="train-button">🧠 Train Model</button>
        </form>

        {% if context %}
            <div class="result">
                Result: {{ context }}
            </div>
        {% endif %}
    </div>
</body>
</html>
